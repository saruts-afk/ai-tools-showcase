name: Deploy to Netlify

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy dist to Netlify
        run: |
          python3 <<'PY' > /tmp/netlify-manifest.json
          import hashlib
          import json
          import os

          files = {}
          for root, _, names in os.walk("dist"):
              for name in names:
                  path = os.path.join(root, name)
                  rel = os.path.relpath(path, "dist").replace(os.sep, "/")
                  with open(path, "rb") as f:
                      files[f"/{rel}"] = hashlib.sha1(f.read()).hexdigest()

          print(json.dumps({"files": files}, separators=(",", ":")))
          PY

          FILE_COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/netlify-manifest.json'))['files']))")
          echo "Deploying ${FILE_COUNT} built files from dist/"

          DEPLOY=$(curl -sf -X POST \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys" \
            -H "Authorization: Bearer $NETLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/netlify-manifest.json)

          echo "$DEPLOY" > /tmp/netlify-deploy.json
          DEPLOY_ID=$(python3 -c "import json; print(json.load(open('/tmp/netlify-deploy.json'))['id'])")

          python3 <<'PY' > /tmp/netlify-required.txt
          import json

          deploy = json.load(open("/tmp/netlify-deploy.json"))
          for item in deploy.get("required", []):
              print(item)
          PY

          REQUIRED_COUNT=$(wc -l < /tmp/netlify-required.txt | tr -d ' ')
          echo "Deploy ID: $DEPLOY_ID"
          echo "Files required by Netlify: $REQUIRED_COUNT"

          find dist -type f | while IFS= read -r file; do
            rel="${file#dist/}"
            hash=$(sha1sum "$file" | awk '{print $1}')

            if grep -q "$hash" /tmp/netlify-required.txt; then
              curl -sf -X PUT \
                "https://api.netlify.com/api/v1/deploys/$DEPLOY_ID/files/$rel" \
                -H "Authorization: Bearer $NETLIFY_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @"$file"
              echo "Uploaded $rel"
            else
              echo "Skipped $rel (already cached)"
            fi
          done

          echo ""
          echo "Live: https://ai-tools-showcase-team.netlify.app"
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ed5d6406-a07d-4eba-99bc-25a76b46ab62
