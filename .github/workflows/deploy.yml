name: Deploy to Netlify

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Netlify
        run: |
          HASH=$(sha1sum index.html | awk '{print $1}')

          # Create a new deploy with file manifest
          DEPLOY=$(curl -sf -X POST \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys" \
            -H "Authorization: Bearer $NETLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"files\":{\"/index.html\":\"${HASH}\"}}")

          DEPLOY_ID=$(echo "$DEPLOY" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          REQUIRED=$(echo "$DEPLOY" | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('required',[])))")

          echo "Deploy ID: $DEPLOY_ID"
          echo "Files to upload: $REQUIRED"

          # Only upload if Netlify doesn't already have this file version cached
          if [ "$REQUIRED" -gt "0" ]; then
            curl -sf -X PUT \
              "https://api.netlify.com/api/v1/deploys/$DEPLOY_ID/files/index.html" \
              -H "Authorization: Bearer $NETLIFY_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @index.html
            echo "Uploaded index.html"
          else
            echo "File already cached, deploy processing..."
          fi

          echo ""
          echo "Live: https://ai-tools-showcase-team.netlify.app"
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ed5d6406-a07d-4eba-99bc-25a76b46ab62
