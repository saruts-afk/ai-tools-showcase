<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Tools — Team Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; font-family: 'Inter', system-ui, sans-serif; }
    body { background: #070711; color: white; overflow-x: hidden; }

    .bg-grid {
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .text-gradient {
      background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.55) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .glass {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes float-x { 0%,100%{transform:translateX(0)} 50%{transform:translateX(6px)} }
    .float-x { animation: float-x 1.4s ease-in-out infinite; }

    .page { position: fixed; inset: 0; overflow-y: auto; }
    .fade-enter { animation: fadeIn 0.35s ease forwards; }
    .fade-exit { animation: fadeOut 0.3s ease forwards; }
    @keyframes fadeIn { from { opacity:0; transform:translateX(24px) } to { opacity:1; transform:translateX(0) } }
    @keyframes fadeOut { from { opacity:1; transform:translateX(0) } to { opacity:0; transform:translateX(-24px) } }

    .tool-card {
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 28px;
      text-align: left;
      display: block;
      width: 100%;
      color: white;
    }
    .tool-card:hover { transform: scale(1.02); }

    .feature-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 24px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .feature-card:hover { transform: scale(1.02); }

    .btn-primary {
      display: inline-flex; align-items: center; gap: 12px;
      padding: 18px 36px; border-radius: 16px;
      font-weight: 700; font-size: 18px; color: white;
      border: none; cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      text-decoration: none;
    }
    .btn-primary:hover { transform: scale(1.03); }

    .section-block {
      border-radius: 20px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .section-header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .section-body { padding: 20px 24px; }
    .section-body li {
      display: flex; align-items: flex-start; gap: 12px;
      margin-bottom: 12px;
      font-size: 14px; color: rgba(255,255,255,0.65);
      line-height: 1.6;
    }
    .section-body li:last-child { margin-bottom: 0; }

    .topbar {
      position: sticky; top: 0; z-index: 20;
      padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(7,7,17,0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .back-btn {
      background: none; border: none; color: rgba(255,255,255,0.45);
      font-size: 14px; cursor: pointer; padding: 6px 0;
      transition: color 0.2s;
    }
    .back-btn:hover { color: white; }

    .tool-nav-pill {
      border: none; cursor: pointer; border-radius: 10px;
      padding: 6px 12px; font-size: 12px; font-weight: 600;
      transition: all 0.2s;
    }

    .ready-badge {
      display: flex; align-items: center; gap: 16px;
      padding: 20px; border-radius: 20px;
      background: rgba(52,211,153,0.08);
      border: 1px solid rgba(52,211,153,0.25);
      margin-bottom: 24px;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

    .tool-nav-row { display: flex; align-items: center; gap: 8px; }
    @media (max-width: 640px) { .tool-nav-row { display: none; } }

    .cover-floats { display: flex; }
    @media (max-width: 768px) { .cover-floats { display: none; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18'
    import { createRoot } from 'https://esm.sh/react-dom@18/client'
    import htm from 'https://esm.sh/htm@3'
    const h = htm.bind(React.createElement)

    // ─── DATA ───────────────────────────────────────────────────────────────
    const tools = [
      {
        id: 'livestream',
        name: 'Livestream',
        tagline: 'Track KOL performance across all platforms',
        description: 'One dashboard for TikTok, YouTube & Facebook live data — powered by AI',
        color: '#f43f5e', shadow: 'rgba(244,63,94,0.35)', bg: 'rgba(244,63,94,0.09)',
        emoji: '📡',
        painPoints: [
          "Manually tracking each KOL's livestream performance is time-consuming",
          "Hard to quickly see the overall livestream performance report",
          "Data is scattered across TikTok, YouTube, and Facebook",
        ],
        solutions: [
          "Auto-crawl livestream data from Facebook, YouTube, and TikTok",
          "Track performance by selected interval and tags",
          "Dashboard showing overall + per-streamer stats: Avg CV, PCV, Live Period",
          "Dedicated dashboard for each KOL or channel",
          "AI generates summary reports from live data with optional extra context",
        ],
        benefits: [
          "Faster and more accurate livestream data tracking",
          "Easier to monitor KOL and channel performance at a glance",
          "Reduces manual checking across platforms",
          "Speeds up report creation dramatically",
        ],
        keyFeatures: [
          { emoji: '🌐', title: 'Multi-Platform Tracking', desc: 'TikTok, YouTube, Facebook in one unified live view' },
          { emoji: '🏷️', title: 'Tag-based Filtering', desc: 'Track overall + streamer performance by tags' },
          { emoji: '📊', title: 'Key Metrics Dashboard', desc: 'Avg CV, PCV, Live Period auto-calculated' },
          { emoji: '🤖', title: 'AI Report Generator', desc: 'One-click summary reports from live session data' },
        ],
        demoUrl: 'https://campaign-space.web.app/team/O3ClYt9izVSN38mMZldZ/liveTracking',
      },
      {
        id: 'bug',
        name: 'Bug Tracker',
        tagline: 'One source of truth for all bug reports',
        description: 'AI duplicate detection, SeaTalk bot integration & public case page',
        color: '#f97316', shadow: 'rgba(249,115,22,0.35)', bg: 'rgba(249,115,22,0.09)',
        emoji: '🐛',
        painPoints: [
          "Bug reports are scattered across sheets",
          "Duplicate bugs are created with different wording",
          "Hard to collect more case details from players",
          "Hard to report bugs when the team is out of office",
          "Regional team does not receive active bug updates",
        ],
        solutions: [
          "One Bug Tracking Module as the single source of truth",
          "Three inputs: internal tracker, public case page, and SeaTalk bot",
          "AI warns about possible duplicates before a report is even created",
          "Players can submit structured case details for specific bugs",
          "SeaTalk bot lets anyone report, update, query, and summarize bugs anytime",
        ],
        benefits: [
          "Makes bug tracking more flexible and easier to manage",
          "Keeps all bug reports in one shared place",
          "Reduces duplicate reports and manual cleanup work",
          "Makes player case collection easier for the team",
          "Helps Regional team get faster, real-time updates",
        ],
        keyFeatures: [
          { emoji: '🤖', title: 'SeaTalk Bot Commands', desc: 'Report, update & check bug status directly in chat' },
          { emoji: '✨', title: 'Smart Duplicate Check', desc: 'AI flags potential duplicates before you submit' },
          { emoji: '🌍', title: 'Public Case Collection', desc: 'Open page for players to submit case details' },
          { emoji: '🔔', title: 'Instant Notifications', desc: 'Real-time alerts when new bugs are reported' },
          { emoji: '📋', title: 'Manager Summaries', desc: 'Built-in queue overviews — no scrolling needed' },
        ],
        demoUrl: 'https://campaign-space.web.app/team/O3ClYt9izVSN38mMZldZ/bugTracker',
      },
      {
        id: 'survey',
        name: 'Survey Analyzer',
        tagline: 'AI-powered survey insights & visualization',
        description: 'Turn raw survey responses into charts, summaries & translated reports',
        color: '#3b82f6', shadow: 'rgba(59,130,246,0.35)', bg: 'rgba(59,130,246,0.09)',
        emoji: '📊',
        painPoints: [
          "Creating survey data visualizations manually is time-consuming",
          "Hard to quickly see the overall survey results and key feedback summary",
          "Translating survey results for Regional or TC review takes extra time",
        ],
        solutions: [
          "Visualization tool combining Teasurvey responses with the question template",
          "Auto-translate results into desired language (TH → ZH or EN)",
          "Generate histograms and heatmaps for selected questions",
          "AI generates charts and summaries from key question prompts",
        ],
        benefits: [
          "Helps the team quickly understand overall survey results",
          "Provides quick answers to survey hypotheses and key questions",
          "Reduces manual work when processing and translating responses",
        ],
        keyFeatures: [
          { emoji: '🗺️', title: 'Data Visualization', desc: 'Heatmaps & histograms with up to 3 data dimensions' },
          { emoji: '⚡', title: 'One-click Report', desc: 'Prompt key questions or hypotheses to prove from the data' },
          { emoji: '🌏', title: 'Auto Translation', desc: 'Auto-translate results TH → ZH or EN for regional review' },
          { emoji: '💡', title: 'AI-Generated Summaries', desc: 'Instant narrative insights from your question prompts' },
        ],
        demoUrl: 'https://campaign-space.web.app/team/O3ClYt9izVSN38mMZldZ/tool/zjiRCGHpqFEmYCPPgtDb?tab=main',
      },
      {
        id: 'elo',
        name: 'Elo Checker',
        tagline: 'Auto-detect suspicious elo boosting patterns',
        description: 'Convert Zeppelin exports into clear, explainable ban evidence in minutes',
        color: '#a855f7', shadow: 'rgba(168,85,247,0.35)', bg: 'rgba(168,85,247,0.09)',
        emoji: '🏆',
        painPoints: [
          "Time-consuming to review banned cases when players report suspected elo boosting",
          "Suspicious patterns are hard to spot in raw Zeppelin CSV exports",
          "Ban list preparation takes too much time",
          "Spreadsheet review is hard to explain to CS or players",
        ],
        solutions: [
          "Convert Zeppelin CSV exports into structured, clear review evidence",
          "Auto-rank suspicious players and camp candidates by risk score",
          "Surface key flags: repeated teammates/opponents, win rate, short matches, KDA",
          "Reviewers mark and export ban candidates with full evidence attached",
        ],
        benefits: [
          "Speeds up banned case checking and appeal review significantly",
          "Makes the review process more consistent and defensible",
          "Easier to identify and explain suspicious behavior to CS or players",
          "Reduces manual checking and ban list preparation time",
          "Final ban decision always stays under human review",
        ],
        keyFeatures: [
          { emoji: '⚙️', title: 'Auto Query Generation', desc: 'Generate Zeppelin SQL from OpenID and date range' },
          { emoji: '🎛️', title: 'Configurable Criteria', desc: 'Set custom elo boosting signal thresholds and rules' },
          { emoji: '🚩', title: 'Suspicious Pattern Flags', desc: 'Win streaks, repeated opponents, short matches, KDA' },
          { emoji: '🔍', title: 'Detailed Visualization', desc: 'Clear evidence view for reviewing each suspected booster' },
        ],
        demoUrl: 'https://campaign-space.web.app/team/O3ClYt9izVSN38mMZldZ/tool/WV31ttqQjwHd5QqO6lrV?tab=main',
      },
    ]

    // ─── ANIMATED SECTION ───────────────────────────────────────────────────
    function Section({ icon, label, sublabel, accentColor, bgColor, borderColor, items, itemIcon }) {
      return h`
        <div class="section-block" style=${{ background: bgColor, border: '1px solid ' + borderColor }}>
          <div class="section-header" style=${{ borderBottom: '1px solid ' + borderColor }}>
            <span style=${{ fontSize: '20px' }}>${icon}</span>
            <div>
              <p style=${{ fontWeight: 700, color: 'white', fontSize: '14px' }}>${label}</p>
              <p style=${{ color: accentColor, fontSize: '12px', opacity: 0.85 }}>${sublabel}</p>
            </div>
          </div>
          <ul class="section-body" style=${{ listStyle: 'none' }}>
            ${items.map((item, i) => h`
              <li key=${i}>
                <span style=${{ fontSize: '15px', flexShrink: 0, marginTop: '1px' }}>${itemIcon}</span>
                <span>${item}</span>
              </li>
            `)}
          </ul>
        </div>
      `
    }

    // ─── TOPBAR ─────────────────────────────────────────────────────────────
    function TopBar({ activeTool, tools, onBack, onSelectTool, backLabel }) {
      return h`
        <div class="topbar">
          <button class="back-btn" onClick=${onBack}>← ${backLabel}</button>
          <div class="tool-nav-row">
            ${tools.map(t => h`
              <button
                key=${t.id}
                class="tool-nav-pill"
                onClick=${() => onSelectTool(t.id)}
                style=${{
                  background: t.id === activeTool ? t.bg : 'transparent',
                  color: t.id === activeTool ? t.color : 'rgba(255,255,255,0.35)',
                  border: t.id === activeTool ? '1px solid ' + t.color + '40' : '1px solid transparent',
                }}
              >
                ${t.emoji} ${t.name}
              </button>
            `)}
          </div>
        </div>
      `
    }

    // ─── COVER ──────────────────────────────────────────────────────────────
    function Cover({ onStart, animIn }) {
      const floats = [
        { emoji: '📡', name: 'Livestream', color: '#f43f5e', top: '28%', left: '8%' },
        { emoji: '🐛', name: 'Bug Tracker', color: '#f97316', top: '25%', right: '8%' },
        { emoji: '📊', name: 'Survey', color: '#3b82f6', bottom: '28%', left: '10%' },
        { emoji: '🏆', name: 'Elo Checker', color: '#a855f7', bottom: '25%', right: '9%' },
      ]
      return h`
        <div
          class=${'page bg-grid fade-enter'}
          style=${{ display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', minHeight: '100vh' }}
          onClick=${onStart}
        >
          <div style=${{ position: 'absolute', top: '30%', left: '25%', width: '500px', height: '500px', borderRadius: '50%', background: 'radial-gradient(circle, rgba(168,85,247,0.1) 0%, transparent 70%)', pointerEvents: 'none' }} />
          <div style=${{ position: 'absolute', bottom: '25%', right: '20%', width: '450px', height: '450px', borderRadius: '50%', background: 'radial-gradient(circle, rgba(244,63,94,0.09) 0%, transparent 70%)', pointerEvents: 'none' }} />

          <div class="cover-floats">
            ${floats.map((f, i) => h`
              <div
                key=${i}
                style=${{
                  position: 'absolute',
                  top: f.top, bottom: f.bottom, left: f.left, right: f.right,
                  display: 'flex', alignItems: 'center', gap: '8px',
                  padding: '8px 16px', borderRadius: '999px',
                  background: 'rgba(255,255,255,0.04)',
                  border: '1px solid ' + f.color + '35',
                  boxShadow: '0 0 20px ' + f.color + '18',
                }}
              >
                <span style=${{ fontSize: '18px' }}>${f.emoji}</span>
                <span style=${{ fontSize: '13px', fontWeight: 500, color: 'rgba(255,255,255,0.65)' }}>${f.name}</span>
              </div>
            `)}
          </div>

          <div style=${{ position: 'relative', zIndex: 10, textAlign: 'center', padding: '0 24px', maxWidth: '640px' }}>
            <div style=${{
              display: 'inline-flex', alignItems: 'center', gap: '8px',
              padding: '6px 16px', borderRadius: '999px', marginBottom: '32px',
              background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)',
              fontSize: '11px', fontWeight: 600, letterSpacing: '0.12em', textTransform: 'uppercase',
            }}>
              <span class="pulse" style=${{ width: '6px', height: '6px', background: '#34d399', borderRadius: '50%', display: 'inline-block' }} />
              <span style=${{ color: 'rgba(255,255,255,0.5)' }}>Built by our team · For every team</span>
            </div>

            <h1 class="text-gradient" style=${{ fontSize: 'clamp(60px, 10vw, 96px)', fontWeight: 900, lineHeight: 1, marginBottom: '20px', letterSpacing: '-2px' }}>
              AI Tools
            </h1>

            <p style=${{ fontSize: '18px', color: 'rgba(255,255,255,0.45)', lineHeight: 1.7, marginBottom: '40px' }}>
              4 tools built to eliminate manual work,<br/>speed up decisions, and help every team move faster.
            </p>

            <button
              onClick=${onStart}
              style=${{
                display: 'inline-flex', alignItems: 'center', gap: '12px',
                padding: '16px 32px', borderRadius: '16px',
                background: 'white', color: '#070711',
                fontWeight: 700, fontSize: '16px', border: 'none', cursor: 'pointer',
                transition: 'all 0.2s',
              }}
              onMouseEnter=${e => { e.target.style.transform = 'scale(1.04)'; e.target.style.boxShadow = '0 0 40px rgba(255,255,255,0.18)' }}
              onMouseLeave=${e => { e.target.style.transform = 'scale(1)'; e.target.style.boxShadow = 'none' }}
            >
              Explore Our Tools
              <span class="float-x">→</span>
            </button>

            <p style=${{ marginTop: '20px', fontSize: '12px', color: 'rgba(255,255,255,0.2)' }}>
              Click anywhere to continue
            </p>
          </div>
        </div>
      `
    }

    // ─── GALLERY ────────────────────────────────────────────────────────────
    function ToolsGallery({ tools, onSelectTool, onBack }) {
      return h`
        <div class="page bg-grid fade-enter" style=${{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '64px 24px' }}>
          <div style=${{ textAlign: 'center', marginBottom: '56px' }}>
            <p style=${{ fontSize: '11px', fontWeight: 600, letterSpacing: '0.12em', textTransform: 'uppercase', color: 'rgba(255,255,255,0.28)', marginBottom: '12px' }}>Team AI Toolkit</p>
            <h2 class="text-gradient" style=${{ fontSize: 'clamp(32px, 5vw, 52px)', fontWeight: 900, marginBottom: '12px' }}>Meet Our 4 AI Tools</h2>
            <p style=${{ color: 'rgba(255,255,255,0.38)', fontSize: '15px' }}>Click any tool to explore what it solves and how it helps you</p>
          </div>

          <div class="grid-2" style=${{ width: '100%', maxWidth: '860px' }}>
            ${tools.map(tool => h`
              <button
                key=${tool.id}
                class="tool-card"
                onClick=${() => onSelectTool(tool.id)}
                style=${{ borderColor: tool.color + '20', boxShadow: 'none', position: 'relative', overflow: 'hidden' }}
                onMouseEnter=${e => { e.currentTarget.style.boxShadow = '0 0 40px ' + tool.shadow; e.currentTarget.style.borderColor = tool.color + '40' }}
                onMouseLeave=${e => { e.currentTarget.style.boxShadow = 'none'; e.currentTarget.style.borderColor = tool.color + '20' }}
              >
                <div style=${{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: '20px' }}>
                  <div style=${{
                    width: '56px', height: '56px', borderRadius: '16px',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontSize: '26px', background: tool.bg, border: '1px solid ' + tool.color + '28',
                  }}>${tool.emoji}</div>
                  <div style=${{
                    display: 'flex', alignItems: 'center', gap: '6px',
                    padding: '4px 10px', borderRadius: '999px', fontSize: '11px', fontWeight: 700,
                    background: 'rgba(52,211,153,0.12)', color: '#34d399', border: '1px solid rgba(52,211,153,0.22)',
                  }}>
                    <span class="pulse" style=${{ width: '6px', height: '6px', background: '#34d399', borderRadius: '50%', display: 'inline-block' }} />
                    LIVE
                  </div>
                </div>

                <h3 style=${{ fontSize: '22px', fontWeight: 800, color: 'white', marginBottom: '4px' }}>${tool.name}</h3>
                <p style=${{ fontSize: '13px', fontWeight: 600, color: tool.color, marginBottom: '10px' }}>${tool.tagline}</p>
                <p style=${{ fontSize: '13px', color: 'rgba(255,255,255,0.38)', lineHeight: 1.6 }}>${tool.description}</p>

                <div style=${{ marginTop: '24px', display: 'flex', alignItems: 'center', gap: '8px', fontSize: '12px', fontWeight: 600, color: tool.color }}>
                  <span>Explore this tool</span>
                  <span class="float-x">→</span>
                </div>
              </button>
            `)}
          </div>
        </div>
      `
    }

    // ─── TOOL DETAIL ────────────────────────────────────────────────────────
    function ToolDetail({ tool, tools, onShowFeatures, onBack, onSelectTool }) {
      return h`
        <div class="page fade-enter bg-grid" style=${{ minHeight: '100vh' }}>
          <${TopBar} activeTool=${tool.id} tools=${tools} onBack=${onBack} onSelectTool=${onSelectTool} backLabel="All Tools" />

          <div style=${{ maxWidth: '720px', margin: '0 auto', padding: '48px 24px' }}>
            <div style=${{ marginBottom: '48px' }}>
              <div style=${{ display: 'flex', alignItems: 'center', gap: '16px', marginBottom: '16px' }}>
                <div style=${{
                  width: '64px', height: '64px', borderRadius: '20px', fontSize: '30px',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  background: tool.bg, border: '1px solid ' + tool.color + '30',
                  flexShrink: 0,
                }}>${tool.emoji}</div>
                <div>
                  <h1 style=${{ fontSize: '36px', fontWeight: 900, color: 'white', lineHeight: 1 }}>${tool.name}</h1>
                  <p style=${{ fontWeight: 600, color: tool.color, marginTop: '4px' }}>${tool.tagline}</p>
                </div>
              </div>
              <p style=${{ color: 'rgba(255,255,255,0.42)', fontSize: '15px', lineHeight: 1.7, paddingLeft: '80px' }}>${tool.description}</p>
            </div>

            <${Section}
              icon="😤" label="Pain Points" sublabel="What's slowing the team down"
              accentColor="#f87171" bgColor="rgba(248,113,113,0.07)" borderColor="rgba(248,113,113,0.2)"
              items=${tool.painPoints} itemIcon="⚠️"
            />
            <${Section}
              icon="💡" label="Our Solution" sublabel="How this tool solves it"
              accentColor="#34d399" bgColor="rgba(52,211,153,0.07)" borderColor="rgba(52,211,153,0.2)"
              items=${tool.solutions} itemIcon="✅"
            />
            <${Section}
              icon="🚀" label="What You Gain" sublabel="Real outcomes for your team"
              accentColor="#60a5fa" bgColor="rgba(96,165,250,0.07)" borderColor="rgba(96,165,250,0.2)"
              items=${tool.benefits} itemIcon="⚡"
            />

            <div class="ready-badge">
              <div style=${{ width: '40px', height: '40px', borderRadius: '12px', background: 'rgba(52,211,153,0.15)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '20px', flexShrink: 0 }}>✅</div>
              <div style=${{ flex: 1 }}>
                <p style=${{ fontWeight: 600, color: '#34d399', fontSize: '14px' }}>Tool Status: Ready to Use</p>
                <p style=${{ fontSize: '12px', color: 'rgba(255,255,255,0.38)', marginTop: '2px' }}>This tool is live and available for your team right now</p>
              </div>
              <div style=${{
                display: 'flex', alignItems: 'center', gap: '6px',
                padding: '4px 12px', borderRadius: '999px',
                background: 'rgba(52,211,153,0.15)', color: '#34d399',
                fontSize: '12px', fontWeight: 700, flexShrink: 0,
              }}>
                <span class="pulse" style=${{ width: '6px', height: '6px', background: '#34d399', borderRadius: '50%', display: 'inline-block' }} />
                LIVE
              </div>
            </div>

            <button
              class="btn-primary"
              onClick=${onShowFeatures}
              style=${{ background: tool.color, width: '100%', justifyContent: 'center', fontSize: '17px' }}
              onMouseEnter=${e => { e.currentTarget.style.boxShadow = '0 0 30px ' + tool.shadow; e.currentTarget.style.transform = 'scale(1.02)' }}
              onMouseLeave=${e => { e.currentTarget.style.boxShadow = 'none'; e.currentTarget.style.transform = 'scale(1)' }}
            >
              See Key Features & Live Demo
              <span class="float-x">→</span>
            </button>
          </div>
        </div>
      `
    }

    // ─── KEY FEATURES ───────────────────────────────────────────────────────
    function KeyFeatures({ tool, tools, onBack, onSelectTool }) {
      return h`
        <div class="page fade-enter bg-grid" style=${{ minHeight: '100vh' }}>
          <${TopBar} activeTool=${tool.id} tools=${tools} onBack=${onBack} onSelectTool=${onSelectTool} backLabel="Back to Overview" />

          <div style=${{ maxWidth: '720px', margin: '0 auto', padding: '48px 24px' }}>
            <div style=${{ marginBottom: '40px' }}>
              <div style=${{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '12px' }}>
                <span style=${{ fontSize: '36px' }}>${tool.emoji}</span>
                <div>
                  <p style=${{ fontSize: '11px', fontWeight: 600, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'rgba(255,255,255,0.28)' }}>Key Features</p>
                  <h2 style=${{ fontSize: '32px', fontWeight: 900, color: 'white', lineHeight: 1 }}>${tool.name}</h2>
                </div>
              </div>
              <div style=${{ height: '1px', background: 'linear-gradient(90deg, ' + tool.color + '60, transparent)', marginTop: '20px' }} />
            </div>

            <div class="grid-2" style=${{ marginBottom: '48px' }}>
              ${tool.keyFeatures.map((f, i) => h`
                <div
                  key=${i}
                  class="feature-card"
                  style=${{ borderColor: tool.color + '20' }}
                  onMouseEnter=${e => { e.currentTarget.style.boxShadow = '0 0 24px ' + tool.shadow; e.currentTarget.style.transform = 'scale(1.02)' }}
                  onMouseLeave=${e => { e.currentTarget.style.boxShadow = 'none'; e.currentTarget.style.transform = 'scale(1)' }}
                >
                  <div style=${{
                    width: '48px', height: '48px', borderRadius: '14px', fontSize: '24px',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    background: tool.bg, border: '1px solid ' + tool.color + '25', marginBottom: '16px',
                  }}>${f.emoji}</div>
                  <h4 style=${{ fontWeight: 700, color: 'white', marginBottom: '8px' }}>${f.title}</h4>
                  <p style=${{ fontSize: '13px', color: 'rgba(255,255,255,0.45)', lineHeight: 1.6 }}>${f.desc}</p>
                </div>
              `)}
            </div>

            <div style=${{ height: '1px', background: 'rgba(255,255,255,0.06)', marginBottom: '40px' }} />

            <div style=${{ textAlign: 'center' }}>
              <p style=${{ color: 'rgba(255,255,255,0.35)', fontSize: '14px', marginBottom: '24px' }}>Ready to see it in action?</p>

              <a
                href=${tool.demoUrl}
                target="_blank"
                rel="noopener noreferrer"
                class="btn-primary"
                style=${{ background: 'linear-gradient(135deg, ' + tool.color + ', ' + tool.color + 'cc)', margin: '0 auto' }}
                onMouseEnter=${e => { e.currentTarget.style.boxShadow = '0 0 50px ' + tool.shadow; e.currentTarget.style.transform = 'scale(1.04)' }}
                onMouseLeave=${e => { e.currentTarget.style.boxShadow = 'none'; e.currentTarget.style.transform = 'scale(1)' }}
              >
                🚀 Launch Live Demo
                <span class="float-x">→</span>
              </a>

              <p style=${{ color: 'rgba(255,255,255,0.18)', fontSize: '12px', marginTop: '12px' }}>Opens in a new tab</p>
            </div>

            <div style=${{ marginTop: '64px', paddingTop: '32px', borderTop: '1px solid rgba(255,255,255,0.05)', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '16px', flexWrap: 'wrap' }}>
              <p style=${{ color: 'rgba(255,255,255,0.22)', fontSize: '12px' }}>Explore other tools</p>
              <div style=${{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                ${tools.filter(t => t.id !== tool.id).map(t => h`
                  <button
                    key=${t.id}
                    onClick=${() => onSelectTool(t.id)}
                    style=${{
                      padding: '6px 14px', borderRadius: '10px', fontSize: '12px', fontWeight: 500,
                      background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)',
                      color: 'rgba(255,255,255,0.42)', cursor: 'pointer', transition: 'all 0.2s',
                    }}
                    onMouseEnter=${e => { e.currentTarget.style.color = 'white'; e.currentTarget.style.borderColor = t.color + '40' }}
                    onMouseLeave=${e => { e.currentTarget.style.color = 'rgba(255,255,255,0.42)'; e.currentTarget.style.borderColor = 'rgba(255,255,255,0.08)' }}
                  >${t.emoji} ${t.name}</button>
                `)}
              </div>
            </div>
          </div>
        </div>
      `
    }

    // ─── APP ────────────────────────────────────────────────────────────────
    function App() {
      const [page, setPage] = useState('cover')
      const [activeTool, setActiveTool] = useState(null)
      const currentTool = tools.find(t => t.id === activeTool)

      const selectTool = (id) => { setActiveTool(id); setPage('detail') }
      const goBack = () => {
        if (page === 'features') setPage('detail')
        else if (page === 'detail') setPage('gallery')
        else if (page === 'gallery') setPage('cover')
      }

      return h`
        <div style=${{ minHeight: '100vh', background: '#070711', color: 'white' }}>
          ${page === 'cover' && h`<${Cover} key="cover" onStart=${() => setPage('gallery')} />`}
          ${page === 'gallery' && h`<${ToolsGallery} key="gallery" tools=${tools} onSelectTool=${selectTool} onBack=${goBack} />`}
          ${page === 'detail' && currentTool && h`<${ToolDetail} key=${'detail-' + activeTool} tool=${currentTool} tools=${tools} onShowFeatures=${() => setPage('features')} onBack=${goBack} onSelectTool=${selectTool} />`}
          ${page === 'features' && currentTool && h`<${KeyFeatures} key=${'features-' + activeTool} tool=${currentTool} tools=${tools} onBack=${goBack} onSelectTool=${selectTool} />`}
        </div>
      `
    }

    createRoot(document.getElementById('root')).render(h`<${App} />`)
  </script>
</body>
</html>
