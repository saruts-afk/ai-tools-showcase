<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AoV TH AI Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; background: #06060f; color: #fff; -webkit-font-smoothing: antialiased; }

    /* ── NAV ─────────────────────────────────────────── */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 52px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px;
      background: rgba(6,6,15,0.85); backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .nav-logo {
      font-size: 13px; font-weight: 700; letter-spacing: 0.02em;
      color: rgba(255,255,255,0.9); cursor: pointer; white-space: nowrap;
    }
    .nav-pills { display: flex; gap: 4px; align-items: center; }
    .nav-pill {
      padding: 4px 12px; border-radius: 8px; font-size: 11px; font-weight: 600;
      cursor: pointer; border: none; transition: all 0.2s; background: transparent;
      color: rgba(255,255,255,0.35);
    }
    .nav-pill.active { color: #fff; }
    .nav-right { display: flex; gap: 8px; align-items: center; }
    .nav-arrows { display: flex; gap: 6px; }
    .nav-arrow {
      width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 14px; transition: all 0.2s;
    }
    .nav-arrow:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .nav-arrow:disabled { opacity: 0.2; cursor: default; }
    .font-toggle {
      display: flex; align-items: center; gap: 2px;
      border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; overflow: hidden;
    }
    .font-btn {
      padding: 4px 9px; background: rgba(255,255,255,0.04); border: none;
      color: rgba(255,255,255,0.6); cursor: pointer; font-family: 'Inter', sans-serif;
      font-weight: 700; transition: all 0.2s; border-right: 1px solid rgba(255,255,255,0.08);
      line-height: 1;
    }
    .font-btn:last-child { border-right: none; }
    .font-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .font-btn.active { background: rgba(255,255,255,0.12); color: #fff; }

    /* ── SLIDE SYSTEM ────────────────────────────────── */
    .slides-viewport { position: fixed; top: 52px; left: 0; right: 0; bottom: 0; overflow: hidden; }
    .slides-track {
      display: flex; height: 100%;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }
    .slide { width: 100vw; height: 100%; flex-shrink: 0; overflow: hidden; }

    /* ── BG GRID ─────────────────────────────────────── */
    .bg-grid {
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 64px 64px;
    }

    /* ── HOME SLIDE ──────────────────────────────────── */
    .home-slide {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 0 40px; gap: 40px;
    }
    .home-header { text-align: center; }
    .home-eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(255,255,255,0.3); margin-bottom: 14px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399; display: inline-block; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .home-title {
      font-size: clamp(44px, 6vw, 72px); font-weight: 900; letter-spacing: -0.03em;
      line-height: 1.05; margin-bottom: 14px;
      background: linear-gradient(135deg, #fff 30%, rgba(255,255,255,0.5) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .home-sub { font-size: 16px; color: rgba(255,255,255,0.38); font-weight: 400; }

    /* ── TOOL CARDS (HOME) ───────────────────────────── */
    .tool-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; width: 100%; max-width: 1160px; }
    .tool-card {
      border-radius: 20px; padding: 24px 22px; cursor: pointer;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      display: flex; flex-direction: column; gap: 10px;
      position: relative; overflow: hidden;
    }
    .tool-card:hover { transform: translateY(-4px); }
    .tool-card-icon {
      width: 52px; height: 52px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .tool-card-icon svg { width: 26px; height: 26px; }
    .tool-card-name { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
    .tool-card-tagline { font-size: 12px; font-weight: 500; line-height: 1.5; }
    .tool-card-points { list-style: none; display: flex; flex-direction: column; gap: 5px; margin-top: 4px; flex: 1; }
    .tool-card-points li { font-size: 11.5px; color: rgba(255,255,255,0.38); line-height: 1.4; display: flex; gap: 6px; }
    .tool-card-points li::before { content: '▸'; flex-shrink: 0; opacity: 0.5; }
    .tool-card-cta {
      margin-top: 6px; display: flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 700; padding: 9px 14px; border-radius: 10px;
      border: none; cursor: pointer; transition: all 0.2s; align-self: flex-start;
    }
    @keyframes slide-right { 0%,100%{transform:translateX(0)} 50%{transform:translateX(4px)} }
    .tool-card-cta:hover span { animation: slide-right 1s ease-in-out infinite; }

    /* ── TOOL DETAIL SLIDE ───────────────────────────── */
    .tool-slide { display: flex; flex-direction: column; }
    .tool-slide-head {
      padding: 22px 32px 16px; display: flex; align-items: center; gap: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0;
    }
    .tool-slide-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .tool-slide-icon svg { width: 22px; height: 22px; }
    .tool-slide-name { font-size: 28px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; }
    .tool-slide-tagline { font-size: 13px; font-weight: 500; margin-top: 3px; opacity: 0.9; }
    .tool-slide-badge {
      margin-left: auto; display: flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 8px;
      background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.25);
      font-size: 11px; font-weight: 700; color: #34d399; white-space: nowrap; flex-shrink: 0;
    }
    .tool-slide-body {
      display: grid; grid-template-columns: repeat(4, 1fr);
      flex: 1; min-height: 0;
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .col {
      padding: 20px 20px 16px; display: flex; flex-direction: column;
      border-right: 1px solid rgba(255,255,255,0.05); overflow: hidden;
    }
    .col:last-child { border-right: none; }
    .col-accent { height: 2px; border-radius: 1px; margin-bottom: 14px; flex-shrink: 0; }
    .col-title {
      font-size: 10px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase;
      color: rgba(255,255,255,0.35); margin-bottom: 12px; flex-shrink: 0;
    }
    .col-items { display: flex; flex-direction: column; gap: 0; flex: 1; min-height: 0; overflow: hidden; }
    .col-item {
      display: flex; align-items: flex-start; gap: 9px; padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04); font-size: var(--fs-body, 13px);
      color: rgba(255,255,255,0.62); line-height: 1.45;
    }
    .col-item:last-child { border-bottom: none; }
    .col-item-dot { flex-shrink: 0; width: 4px; height: 4px; border-radius: 50%; margin-top: 6px; }
    .col-step {
      display: flex; align-items: flex-start; gap: 10px; padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04); font-size: var(--fs-body, 13px);
      color: rgba(255,255,255,0.62); line-height: 1.45;
    }
    .col-step:last-child { border-bottom: none; }
    .col-step-num {
      width: 18px; height: 18px; border-radius: 6px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 800; margin-top: 1px;
    }
    .col-section-label {
      font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.25); margin: 12px 0 6px; flex-shrink: 0;
    }
    .col-feature {
      display: flex; align-items: flex-start; gap: 7px; padding: 5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04); font-size: var(--fs-small, 12px);
      color: rgba(255,255,255,0.5); line-height: 1.4;
    }
    .col-feature:last-child { border-bottom: none; }
    .col-spacer { flex: 1; }
    .demo-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 16px; border-radius: 11px; border: none; cursor: pointer;
      font-size: 13px; font-weight: 700; color: white;
      transition: all 0.2s; text-decoration: none; flex-shrink: 0; margin-top: 12px;
    }
    .demo-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }

    /* ── SLIDE PROGRESS BAR ──────────────────────────── */
    .progress-bar { height: 2px; background: rgba(255,255,255,0.06); position: fixed; bottom: 0; left: 0; right: 0; }
    .progress-fill { height: 100%; transition: width 0.6s cubic-bezier(0.16,1,0.3,1); }

    /* ── TOUCH / SWIPE HINT ──────────────────────────── */
    .slide-hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: rgba(255,255,255,0.18); pointer-events: none;
      white-space: nowrap;
    }

    @media (max-width: 900px) {
      .tool-cards { grid-template-columns: repeat(2, 1fr); }
      .tool-slide-body { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React, { useState, useEffect, useCallback } from 'https://esm.sh/react@18'
    import { createRoot } from 'https://esm.sh/react-dom@18/client'
    import htm from 'https://esm.sh/htm@3'
    const h = htm.bind(React.createElement)

    // ── SVG ICONS (no emoji encoding issues) ──────────────────────────────
    const IconLive = (color) => h`<svg viewBox="0 0 24 24" fill="none" stroke=${color} stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="16" r="1.8" fill=${color} stroke="none"/>
      <path d="M9 13a4.5 4.5 0 0 1 6 0"/>
      <path d="M5.5 9.5a9 9 0 0 1 13 0"/>
    </svg>`

    const IconBug = (color) => h`<svg viewBox="0 0 24 24" fill="none" stroke=${color} stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="13.5" rx="3" ry="4.5"/>
      <path d="M10 8.5V7a2 2 0 0 1 4 0v1.5"/>
      <path d="M9 9.5l-2.5-2M15 9.5l2.5-2"/>
      <path d="M6 12.5H4M20 12.5h-2"/>
      <path d="M6 16H4M20 16h-2"/>
    </svg>`

    const IconSurvey = (color) => h`<svg viewBox="0 0 24 24" fill="none" stroke=${color} stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="12" width="4" height="9" rx="1"/>
      <rect x="9.5" y="7" width="4" height="14" rx="1"/>
      <rect x="16" y="3" width="4" height="18" rx="1"/>
    </svg>`

    const IconElo = (color) => h`<svg viewBox="0 0 24 24" fill="none" stroke=${color} stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h12v11a6 6 0 0 1-12 0z"/>
      <path d="M6 7H3v4a3 3 0 0 0 3 3M18 7h3v4a3 3 0 0 1-3 3"/>
      <path d="M12 17v4M9 21h6"/>
    </svg>`

    const ICONS = { livestream: IconLive, bug: IconBug, survey: IconSurvey, elo: IconElo }

    // ── TOOLS DATA ────────────────────────────────────────────────────────
    const tools = [
      {
        id: 'livestream',
        name: 'Livestream',
        tagline: 'Track every KOL. Every platform. In real time.',
        cardPoints: ['Auto-track TikTok, YouTube & Facebook', 'AI-generated reports in one click', 'Per-channel dashboards & metrics'],
        color: '#ff3b5c', shadow: 'rgba(255,59,92,0.3)', bg: 'rgba(255,59,92,0.1)', dim: 'rgba(255,59,92,0.18)',
        painPoints: [
          'Hours wasted tracking KOL performance across platforms manually',
          'No single view of overall livestream performance',
          'Data locked in TikTok, YouTube & Facebook silos — never in one place',
        ],
        solutions: [
          'Auto-crawl livestream data from TikTok, YouTube & Facebook',
          'Filter and track by tags and custom time intervals',
          'Unified dashboard: overall + per-streamer stats (Avg CV, PCV, live duration)',
          'Dedicated performance view for each KOL or channel',
          'One-click AI report from live session data',
        ],
        benefits: [
          'Instant cross-platform visibility — no more tab-switching',
          'AI reports in seconds, not hours of manual work',
          'Monitor any KOL or channel from a single dashboard',
          'More time for strategy, less time on data wrangling',
        ],
        howToUse: [
          { n: '1', text: 'Create a team — define members, settings & tracking config' },
          { n: '2', text: 'Enable Live Tracking Module for the team' },
          { n: '3', text: 'Create a session, set config, then monitor live & generate report' },
        ],
        keyFeatures: [
          'Multi-platform: TikTok, YouTube, Facebook in one view',
          'Tag-based: track overall + per-streamer performance',
          'Key metrics: Avg CV, PCV, Live Period auto-calculated',
          'AI report generator from live + optional extra context',
        ],
        demoUrl: 'https://campaign-space.web.app/team/O3ClYt9izVSN38mMZldZ/liveTracking',
      },
      {
        id: 'bug',
        name: 'Bug Tracker',
        tagline: 'One place for every bug. Zero duplicates. Always updated.',
        cardPoints: ['AI detects duplicates before submission', 'SeaTalk bot: report bugs from chat', 'Public case page for player reports'],
        color: '#ff6b35', shadow: 'rgba(255,107,53,0.3)', bg: 'rgba(255,107,53,0.1)', dim: 'rgba(255,107,53,0.18)',
        painPoints: [
          'Bug reports scattered across multiple spreadsheets with no single source of truth',
          'Duplicates created constantly because no AI check exists',
          'Hard to get structured case details from players who found the bug',
          'Impossible to report new bugs when the team is out of office',
          'Regional teams miss active updates and are always out of the loop',
        ],
        solutions: [
          'One unified Bug Tracker as the single source of truth for every report',
          'Three input channels: internal tracker, public case page & SeaTalk bot',
          'AI automatically detects potential duplicates before any report is submitted',
          'Players submit structured case details through a public-facing page',
          'SeaTalk bot lets anyone report, update, query & summarize bugs anytime',
        ],
        benefits: [
          'All bugs in one place — never lose a report again',
          'AI eliminates duplicate noise before it clutters the tracker',
          'Players contribute case details directly, saving investigation time',
          'Report bugs 24/7 via SeaTalk — even outside office hours',
          'Regional teams get real-time updates without asking anyone',
        ],
        howToUse: [
          { n: '1', text: 'Create a team — own your bugs, members & settings' },
          { n: '2', text: 'Enable Bug Tracking Module & connect your SeaTalk group' },
          { n: '3', text: 'Report via internal tracker, public page, or SeaTalk bot' },
          { n: '4', text: 'All reports merge into one shared, always-up-to-date record' },
        ],
        keyFeatures: [
          'SeaTalk bot: report, update & check bug status via chat',
          'AI smart duplicate detection before submission',
          'Public case collection page for player submissions',
          'Manager queue summaries — no manual scrolling needed',
        ],
        demoUrl: 'https://campaign-space.web.app/team/O3ClYt9izVSN38mMZldZ/bugTracker',
      },
      {
        id: 'survey',
        name: 'Survey Analyzer',
        tagline: 'From raw responses to insights in one click.',
        cardPoints: ['Auto-translate TH to ZH or EN', 'Heatmaps & histograms in seconds', 'AI summaries from key question prompts'],
        color: '#3b8bff', shadow: 'rgba(59,139,255,0.3)', bg: 'rgba(59,139,255,0.1)', dim: 'rgba(59,139,255,0.18)',
        painPoints: [
          'Building visualizations from survey data takes too long to do manually',
          'Hard to quickly extract the key insight from hundreds of responses',
          'Translating results into Chinese or English for regional review adds extra hours',
        ],
        solutions: [
          'Combine Teasurvey responses with the question template automatically',
          'Auto-translate results into any target language — TH to ZH or EN',
          'Generate histograms & heatmaps for any selected question set',
          'AI creates charts and narrative summaries from your key question prompts',
        ],
        benefits: [
          'Understand full survey results in minutes, not days',
          'Instantly answer hypotheses with AI-driven analysis',
          'Eliminate manual translation and chart-building work',
        ],
        howToUse: [
          { n: '1', text: 'Create a team & set up the Survey Analyzer tool inside it' },
          { n: '2', text: 'Upload your survey questions and response data' },
          { n: '3', text: 'Check mapping, then generate charts, summaries & translated reports' },
        ],
        keyFeatures: [
          'Heatmaps & histograms — up to 3 data dimensions',
          'One-click report with custom question prompts or hypotheses',
          'Auto-translation: TH to ZH or EN for regional review',
          'AI-generated narrative summaries from any question set',
        ],
        demoUrl: 'https://campaign-space.web.app/team/O3ClYt9izVSN38mMZldZ/tool/zjiRCGHpqFEmYCPPgtDb?tab=main',
      },
      {
        id: 'elo',
        name: 'Elo Checker',
        tagline: 'Turn match data into clear, explainable ban evidence.',
        cardPoints: ['Auto-generate Zeppelin SQL queries', 'Flags: win rates, opponents, KDA', 'Export ban list with full evidence'],
        color: '#a855f7', shadow: 'rgba(168,85,247,0.3)', bg: 'rgba(168,85,247,0.1)', dim: 'rgba(168,85,247,0.18)',
        painPoints: [
          'Reviewing suspected elo boosting cases takes hours of manual effort',
          'Suspicious patterns are invisible inside raw Zeppelin CSV exports',
          'Preparing a ban list is a slow, tedious, error-prone process',
          'Hard to explain spreadsheet findings to CS teams or players in appeals',
        ],
        solutions: [
          'Convert Zeppelin CSV exports into clean, structured review evidence automatically',
          'Auto-rank suspicious players and camp candidates by risk score',
          'Surface key flags: repeated opponents, win rate, short matches, KDA, grade, hero usage',
          'Reviewers mark candidates and export a ban list with full supporting evidence',
        ],
        benefits: [
          'Case reviews drop from hours to minutes',
          'Consistent, defensible decisions every single time',
          'Evidence is visual and easy to explain to CS or players',
          'Less manual prep — more time on actual judgment calls',
          'Final ban decision always stays under human review',
        ],
        howToUse: [
          { n: '1', text: 'Create a team & configure thresholds in the Elo Checker tool' },
          { n: '2', text: 'Generate SQL from the tool, run on Zeppelin, upload the CSV' },
          { n: '3', text: 'Review auto-flagged suspects and mark ban candidates' },
        ],
        keyFeatures: [
          'Auto-generate Zeppelin SQL from OpenID & date range',
          'Configurable detection rules & boosting signal thresholds',
          'Key signals: win streaks, repeated opponents, short matches, KDA',
          'Detailed visualization for each suspected booster',
        ],
        demoUrl: 'https://campaign-space.web.app/team/O3ClYt9izVSN38mMZldZ/tool/WV31ttqQjwHd5QqO6lrV?tab=main',
      },
    ]

    // ── TOP NAV ──────────────────────────────────────────────────────────
    function NavBar({ current, total, tools, onNavigate, fontSize, onFontSize }) {
      const sizes = ['S', 'M', 'L']
      return h`
        <nav class="nav">
          <span class="nav-logo" onClick=${() => onNavigate(0)}>AoV TH AI Tools</span>

          <div class="nav-pills">
            <button class=${'nav-pill' + (current === 0 ? ' active' : '')} style=${{ color: current === 0 ? '#fff' : '' }} onClick=${() => onNavigate(0)}>Overview</button>
            ${tools.map((t, i) => {
              const isActive = current === i+1 || current === i+5
              return h`
                <button key=${t.id} class=${'nav-pill' + (isActive ? ' active' : '')}
                  style=${{ color: isActive ? t.color : '', background: isActive ? t.bg : '' }}
                  onClick=${() => onNavigate(i+1)}>
                  ${t.name}
                </button>
              `
            })}
          </div>

          <div class="nav-right">
            <div class="font-toggle" title="Text size">
              ${sizes.map(s => h`
                <button key=${s} class=${'font-btn' + (fontSize === s ? ' active' : '')}
                  style=${{ fontSize: s === 'S' ? '10px' : s === 'M' ? '12px' : '14px' }}
                  onClick=${() => onFontSize(s)}>A</button>
              `)}
            </div>
            <div class="nav-arrows">
              <button class="nav-arrow" onClick=${() => onNavigate(current - 1)} disabled=${current === 0}>←</button>
              <button class="nav-arrow" onClick=${() => onNavigate(current + 1)} disabled=${current === total - 1}>→</button>
            </div>
          </div>
        </nav>
      `
    }

    // ── HOME SLIDE ───────────────────────────────────────────────────────
    function HomeSlide({ tools, onSelectTool }) {
      return h`
        <div class="slide home-slide bg-grid">
          <div style=${{ position: 'absolute', top: '20%', left: '15%', width: '600px', height: '600px', borderRadius: '50%', background: 'radial-gradient(circle, rgba(168,85,247,0.07) 0%, transparent 65%)', pointerEvents: 'none' }} />
          <div style=${{ position: 'absolute', bottom: '15%', right: '10%', width: '500px', height: '500px', borderRadius: '50%', background: 'radial-gradient(circle, rgba(59,139,255,0.06) 0%, transparent 65%)', pointerEvents: 'none' }} />

          <div class="home-header" style=${{ position: 'relative', zIndex: 1 }}>
            <div class="home-eyebrow">
              <span class="live-dot" />
              All tools are live and ready to use
            </div>
            <h1 class="home-title">AoV TH AI Tools</h1>
            <p class="home-sub">4 tools built to eliminate manual work and help every team move faster</p>
          </div>

          <div class="tool-cards" style=${{ position: 'relative', zIndex: 1 }}>
            ${tools.map((tool, i) => h`
              <div
                key=${tool.id}
                class="tool-card"
                style=${{ borderColor: tool.color + '25' }}
                onClick=${() => onSelectTool(i + 1)}
                onMouseEnter=${e => { e.currentTarget.style.boxShadow = '0 20px 60px ' + tool.shadow; e.currentTarget.style.borderColor = tool.color + '50' }}
                onMouseLeave=${e => { e.currentTarget.style.boxShadow = 'none'; e.currentTarget.style.borderColor = tool.color + '25' }}
              >
                <div class="tool-card-icon" style=${{ background: tool.bg }}>
                  ${ICONS[tool.id](tool.color)}
                </div>
                <div>
                  <div class="tool-card-name">${tool.name}</div>
                  <div class="tool-card-tagline" style=${{ color: tool.color }}>${tool.tagline}</div>
                </div>
                <ul class="tool-card-points">
                  ${tool.cardPoints.map((p, j) => h`<li key=${j}>${p}</li>`)}
                </ul>
                <button
                  class="tool-card-cta"
                  style=${{ background: tool.dim, color: tool.color }}
                >
                  Explore →
                </button>
              </div>
            `)}
          </div>
        </div>
      `
    }

    // ── TOOL FEATURES SLIDE ─────────────────────────────────────────────
    function ToolFeaturesSlide({ tool, onBack }) {
      return h`
        <div class="slide tool-slide bg-grid" style=${{ display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', padding: '0 6vw' }}>

          <div style=${{ position: 'absolute', top: '20%', left: '10%', width: '500px', height: '500px', borderRadius: '50%', background: 'radial-gradient(circle, ' + tool.shadow + ' 0%, transparent 65%)', pointerEvents: 'none', opacity: 0.6 }} />

          <div style=${{ position: 'relative', zIndex: 1, width: '100%', maxWidth: '960px' }}>

            <!-- Header -->
            <div style=${{ display: 'flex', alignItems: 'center', gap: '16px', marginBottom: '12px' }}>
              <div class="tool-slide-icon" style=${{ background: tool.bg }}>
                ${ICONS[tool.id](tool.color)}
              </div>
              <div>
                <div style=${{ fontSize: '22px', fontWeight: 700, letterSpacing: '-0.5px', color: '#fff' }}>${tool.name}</div>
                <div style=${{ fontSize: '13px', color: tool.color, fontWeight: 500, marginTop: '2px' }}>${tool.tagline}</div>
              </div>
              <div style=${{ marginLeft: 'auto' }}>
                <button
                  onClick=${onBack}
                  style=${{ background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)', borderRadius: '8px', color: 'rgba(255,255,255,0.6)', fontSize: '13px', padding: '7px 16px', cursor: 'pointer' }}
                >← Back to Overview</button>
              </div>
            </div>

            <div style=${{ fontSize: '11px', fontWeight: 600, letterSpacing: '0.12em', color: 'rgba(255,255,255,0.35)', textTransform: 'uppercase', marginBottom: '20px' }}>Key Features</div>

            <!-- 2x2 Feature Cards Grid -->
            <div style=${{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginBottom: '28px' }}>
              ${tool.keyFeatures.map((feat, i) => h`
                <div key=${i} style=${{
                  background: 'rgba(255,255,255,0.04)',
                  border: '1px solid rgba(255,255,255,0.08)',
                  borderRadius: '14px',
                  padding: '22px 24px',
                  display: 'flex',
                  gap: '16px',
                  alignItems: 'flex-start',
                  transition: 'border-color 0.2s',
                }}>
                  <div style=${{
                    width: '36px', height: '36px', borderRadius: '10px',
                    background: tool.dim, color: tool.color,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontSize: '16px', fontWeight: 800, flexShrink: 0,
                  }}>${i + 1}</div>
                  <div style=${{ fontSize: '14px', lineHeight: 1.55, color: 'rgba(255,255,255,0.88)', paddingTop: '8px' }}>${feat}</div>
                </div>
              `)}
            </div>

            <!-- Demo CTA -->
            <div style=${{ textAlign: 'center' }}>
              <a
                href=${tool.demoUrl}
                target="_blank"
                rel="noopener noreferrer"
                style=${{
                  display: 'inline-flex', alignItems: 'center', gap: '10px',
                  background: tool.color, color: '#fff',
                  padding: '15px 40px', borderRadius: '50px',
                  fontSize: '16px', fontWeight: 700,
                  textDecoration: 'none', letterSpacing: '-0.2px',
                  boxShadow: '0 8px 32px ' + tool.shadow,
                  transition: 'opacity 0.2s, transform 0.2s',
                }}
                onMouseEnter=${e => { e.currentTarget.style.opacity = '0.88'; e.currentTarget.style.transform = 'scale(1.03)' }}
                onMouseLeave=${e => { e.currentTarget.style.opacity = '1'; e.currentTarget.style.transform = 'scale(1)' }}
              >
                Launch Live Demo →
              </a>
            </div>

          </div>
        </div>
      `
    }

    // ── TOOL DETAIL SLIDE ────────────────────────────────────────────────
    function ToolSlide({ tool, onShowFeatures }) {
      const colColors = {
        problem: '#ff5c5c',
        solution: '#34d399',
        benefits: '#60a5fa',
        start: tool.color,
      }

      return h`
        <div class="slide tool-slide bg-grid">
          <div class="tool-slide-head">
            <div class="tool-slide-icon" style=${{ background: tool.bg }}>
              ${ICONS[tool.id](tool.color)}
            </div>
            <div>
              <div class="tool-slide-name">${tool.name}</div>
              <div class="tool-slide-tagline" style=${{ color: tool.color }}>${tool.tagline}</div>
            </div>
            <div class="tool-slide-badge">
              <span class="live-dot" />
              Ready to Use
            </div>
          </div>

          <div class="tool-slide-body">

            <!-- PROBLEM -->
            <div class="col">
              <div class="col-accent" style=${{ background: colColors.problem }} />
              <div class="col-title">The Problem</div>
              <div class="col-items">
                ${tool.painPoints.map((p, i) => h`
                  <div key=${i} class="col-item">
                    <span class="col-item-dot" style=${{ background: colColors.problem }} />
                    ${p}
                  </div>
                `)}
              </div>
            </div>

            <!-- SOLUTION -->
            <div class="col">
              <div class="col-accent" style=${{ background: colColors.solution }} />
              <div class="col-title">Our Solution</div>
              <div class="col-items">
                ${tool.solutions.map((s, i) => h`
                  <div key=${i} class="col-item">
                    <span class="col-item-dot" style=${{ background: colColors.solution }} />
                    ${s}
                  </div>
                `)}
              </div>
            </div>

            <!-- BENEFITS -->
            <div class="col">
              <div class="col-accent" style=${{ background: colColors.benefits }} />
              <div class="col-title">What You Gain</div>
              <div class="col-items">
                ${tool.benefits.map((b, i) => h`
                  <div key=${i} class="col-item">
                    <span class="col-item-dot" style=${{ background: colColors.benefits }} />
                    ${b}
                  </div>
                `)}
              </div>
            </div>

            <!-- GET STARTED -->
            <div class="col">
              <div class="col-accent" style=${{ background: tool.color }} />
              <div class="col-title">Get Started</div>

              <div class="col-section-label">How to Use</div>
              ${tool.howToUse.map((step, i) => h`
                <div key=${i} class="col-step">
                  <span class="col-step-num" style=${{ background: tool.dim, color: tool.color }}>${step.n}</span>
                  ${step.text}
                </div>
              `)}

              <div class="col-spacer" />

              <button
                onClick=${onShowFeatures}
                style=${{
                  width: '100%', padding: '11px 0', borderRadius: '10px',
                  background: tool.dim, border: '1px solid ' + tool.color + '40',
                  color: tool.color, fontSize: '13px', fontWeight: 600,
                  cursor: 'pointer', marginBottom: '10px',
                  letterSpacing: '-0.1px',
                }}
              >View Key Features →</button>

              <a
                href=${tool.demoUrl}
                target="_blank"
                rel="noopener noreferrer"
                class="demo-btn"
                style=${{ background: tool.color }}
              >
                Launch Live Demo →
              </a>
            </div>

          </div>
        </div>
      `
    }

    // ── APP ──────────────────────────────────────────────────────────────
    const FONT_SCALES = {
      S: { '--fs-body': '12px', '--fs-small': '11px' },
      M: { '--fs-body': '14px', '--fs-small': '12.5px' },
      L: { '--fs-body': '16.5px', '--fs-small': '14.5px' },
    }

    function App() {
      // slides: 0=home, 1-4=detail, 5-8=features
      const total = 9
      const [current, setCurrent] = useState(0)
      const [fontSize, setFontSize] = useState('M')

      const navigate = useCallback((idx) => {
        if (idx >= 0 && idx < total) setCurrent(idx)
      }, [total])

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') navigate(current + 1)
          if (e.key === 'ArrowLeft') navigate(current - 1)
        }
        window.addEventListener('keydown', onKey)
        return () => window.removeEventListener('keydown', onKey)
      }, [current, navigate])

      // Touch/swipe support
      useEffect(() => {
        let startX = null
        const onTouchStart = (e) => { startX = e.touches[0].clientX }
        const onTouchEnd = (e) => {
          if (startX === null) return
          const dx = startX - e.changedTouches[0].clientX
          if (Math.abs(dx) > 60) navigate(dx > 0 ? current + 1 : current - 1)
          startX = null
        }
        window.addEventListener('touchstart', onTouchStart, { passive: true })
        window.addEventListener('touchend', onTouchEnd, { passive: true })
        return () => { window.removeEventListener('touchstart', onTouchStart); window.removeEventListener('touchend', onTouchEnd) }
      }, [current, navigate])

      const progressPct = (current / (total - 1)) * 100
      const activeTool = current >= 1 && current <= 4 ? tools[current - 1]
                       : current >= 5 ? tools[current - 5] : null

      return h`
        <div>
          <${NavBar} current=${current} total=${total} tools=${tools} onNavigate=${navigate} fontSize=${fontSize} onFontSize=${setFontSize} />

          <div class="slides-viewport" style=${FONT_SCALES[fontSize]}>
            <div class="slides-track" style=${{ transform: 'translateX(' + (-current * 100) + 'vw)' }}>
              <${HomeSlide} tools=${tools} onSelectTool=${navigate} />
              ${tools.map((tool, i) => h`
                <${ToolSlide} key=${tool.id} tool=${tool} onShowFeatures=${() => navigate(i + 5)} />
              `)}
              ${tools.map((tool, i) => h`
                <${ToolFeaturesSlide} key=${'feat-' + tool.id} tool=${tool} onBack=${() => navigate(i + 1)} />
              `)}
            </div>
          </div>

          <div class="progress-bar">
            <div class="progress-fill" style=${{ width: progressPct + '%', background: activeTool ? activeTool.color : 'rgba(255,255,255,0.3)' }} />
          </div>

          <div class="slide-hint">Use ← → arrow keys or swipe to navigate</div>
        </div>
      `
    }

    createRoot(document.getElementById('root')).render(h`<${App} />`)
  </script>
</body>
</html>
