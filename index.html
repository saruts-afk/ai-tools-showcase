<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AoV TH AI Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; background: #06060f; color: #fff; -webkit-font-smoothing: antialiased; }

    /* ── NAV ─────────────────────────────────────────── */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 52px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px;
      background: rgba(6,6,15,0.85); backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .nav-logo {
      font-size: 13px; font-weight: 700; letter-spacing: 0.02em;
      color: rgba(255,255,255,0.9); cursor: pointer; white-space: nowrap;
    }
    .nav-pills { display: flex; gap: 4px; align-items: center; }
    .nav-pill {
      padding: 5px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; transition: all 0.2s; background: transparent;
      color: rgba(255,255,255,0.35);
    }
    .nav-pill.active { color: #fff; }
    .nav-right { display: flex; gap: 8px; align-items: center; }
    .nav-arrows { display: flex; gap: 6px; }
    .nav-arrow {
      width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 14px; transition: all 0.2s;
    }
    .nav-arrow:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .nav-arrow:disabled { opacity: 0.2; cursor: default; }

    /* ── SLIDE SYSTEM ────────────────────────────────── */
    .slides-viewport { position: fixed; top: 52px; left: 0; right: 0; bottom: 0; overflow: hidden; }
    .slides-track {
      display: flex; height: 100%;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }
    .slide { width: 100vw; height: 100%; flex-shrink: 0; overflow: hidden; position: relative; }

    /* ── BG GRID ─────────────────────────────────────── */
    .bg-grid {
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 64px 64px;
    }

    /* ── HOME SLIDE ──────────────────────────────────── */
    .home-slide {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 0 40px; gap: 40px;
    }
    .home-header { text-align: center; }
    .home-eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(255,255,255,0.3); margin-bottom: 14px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399; display: inline-block; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .home-title {
      font-size: clamp(44px, 6vw, 72px); font-weight: 900; letter-spacing: -0.03em;
      line-height: 1.05; margin-bottom: 14px;
      background: linear-gradient(135deg, #fff 30%, rgba(255,255,255,0.5) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .home-sub { font-size: 16px; color: rgba(255,255,255,0.38); font-weight: 400; }

    /* ── TOOL CARDS (HOME) ───────────────────────────── */
    .tool-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; width: 100%; max-width: 1400px; }
    .tool-card {
      border-radius: 20px; padding: 32px 26px; cursor: pointer;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      display: flex; flex-direction: column; gap: 10px;
      position: relative; overflow: hidden;
    }
    .tool-card:hover { transform: translateY(-4px); }
    .tool-card-icon {
      width: 52px; height: 52px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .tool-card-icon svg { width: 26px; height: 26px; }
    .tool-card-name { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .tool-card-tagline { font-size: 12px; font-weight: 500; line-height: 1.5; }
    .tool-card-points { list-style: none; display: flex; flex-direction: column; gap: 5px; margin-top: 4px; flex: 1; }
    .tool-card-points li { font-size: 11.5px; color: rgba(255,255,255,0.38); line-height: 1.4; display: flex; gap: 6px; }
    .tool-card-points li::before { content: '▸'; flex-shrink: 0; opacity: 0.5; }
    .tool-card-cta {
      margin-top: 6px; display: flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 700; padding: 9px 14px; border-radius: 10px;
      border: none; cursor: pointer; transition: all 0.2s; align-self: flex-start;
    }
    @keyframes slide-right { 0%,100%{transform:translateX(0)} 50%{transform:translateX(4px)} }
    .tool-card-cta:hover span { animation: slide-right 1s ease-in-out infinite; }

    /* ── TOOL DETAIL SLIDE ───────────────────────────── */
    .tool-slide { display: flex; flex-direction: column; }
    .tool-slide-head {
      padding: 22px 32px 16px; display: flex; align-items: center; gap: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0;
    }
    .tool-slide-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .tool-slide-icon svg { width: 22px; height: 22px; }
    .tool-slide-name { font-size: 28px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; }
    .tool-slide-tagline { font-size: 13px; font-weight: 500; margin-top: 3px; opacity: 0.9; }
    .tool-slide-badge {
      margin-left: auto; display: flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 8px;
      background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.25);
      font-size: 11px; font-weight: 700; color: #34d399; white-space: nowrap; flex-shrink: 0;
    }
    /* ── BENTO GRID (DETAIL SLIDE) ──────────────────────── */
    .tool-bento {
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
      gap: 12px; flex: 1; min-height: 0; padding: 14px 24px 20px;
    }
    .bento-cell {
      border-radius: 18px; padding: 18px 20px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      display: flex; flex-direction: column; position: relative; overflow: hidden;
    }
    .bento-cell-num {
      position: absolute; right: 14px; top: 6px; font-size: 80px; font-weight: 900;
      line-height: 1; letter-spacing: -4px; opacity: 0.045; pointer-events: none;
      color: #fff;
    }
    .bento-cell-head {
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-shrink: 0;
    }
    .bento-stripe { width: 3px; height: 18px; border-radius: 2px; flex-shrink: 0; }
    .bento-label {
      font-size: 15px; font-weight: 800; letter-spacing: -0.01em;
      color: rgba(255,255,255,0.92);
    }
    .bento-items { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; overflow: hidden; }
    .bento-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 13px; border-radius: 10px;
      background: rgba(255,255,255,0.05);
      font-size: 14px; color: rgba(255,255,255,0.88); line-height: 1.6;
    }
    .bento-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
    .bento-step {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px; border-radius: 10px;
      background: rgba(255,255,255,0.05);
      font-size: 14px; color: rgba(255,255,255,0.88); line-height: 1.6;
    }
    .bento-step-num {
      width: 20px; height: 20px; border-radius: 7px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 800; margin-top: 0px;
    }
    .bento-divider { height: 1px; background: rgba(255,255,255,0.07); margin: 10px 0; flex-shrink: 0; }
    .demo-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 16px; border-radius: 11px; border: none; cursor: pointer;
      font-size: 13px; font-weight: 700; color: white;
      transition: all 0.2s; text-decoration: none; flex-shrink: 0; margin-top: 12px;
    }
    .demo-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }

    /* ── SLIDE PROGRESS BAR ──────────────────────────── */
    .progress-bar { height: 2px; background: rgba(255,255,255,0.06); position: fixed; bottom: 0; left: 0; right: 0; }
    .progress-fill { height: 100%; transition: width 0.6s cubic-bezier(0.16,1,0.3,1); }

    /* ── TOUCH / SWIPE HINT ──────────────────────────── */
    .slide-hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: rgba(255,255,255,0.18); pointer-events: none;
      white-space: nowrap;
    }

    @media (max-width: 1100px) {
      .tool-bento { padding: 10px 16px 14px; gap: 10px; }
      .bento-item { font-size: 13px; }
      .bento-step { font-size: 13px; }
      .bento-label { font-size: 13px; }
    }
    @media (max-width: 900px) {
      .tool-cards { grid-template-columns: repeat(2, 1fr); }
      .nav { padding: 0 16px; }
      .nav-pill { padding: 4px 10px; font-size: 12px; }
      .tool-slide-head { padding: 14px 20px 12px; gap: 12px; }
      .tool-slide-name { font-size: 22px; }
      .tool-slide-tagline { font-size: 12px; }
      .tool-bento { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 640px) {
      .nav-pills { gap: 2px; }
      .nav-pill { padding: 3px 8px; font-size: 11px; }
      .tool-bento { grid-template-columns: 1fr; grid-template-rows: auto; overflow-y: auto; padding: 8px 12px 12px; }
      .tool-cards { grid-template-columns: 1fr 1fr; }
      .home-slide { padding: 0 20px; gap: 24px; }
    }
    @media (max-width: 480px) {
      .nav-pills { display: none; }
      .tool-cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React, { useState, useEffect, useCallback, useRef } from 'https://esm.sh/react@18'
    import { createRoot } from 'https://esm.sh/react-dom@18/client'
    import htm from 'https://esm.sh/htm@3'
    const h = htm.bind(React.createElement)

    // ── SVG ICONS (no emoji encoding issues) ──────────────────────────────

    </svg>`

    const ICONS = { livestream: IconLive, bug: IconBug, survey: IconSurvey, elo: IconElo }

    // ── TOOLS DATA ────────────────────────────────────────────────────────
    const tools = [
      {

        keyFeatures: [],

            title: 'Track Livestream Performance Data',
            points: [

            ],
            image: 'images/livestream-tracking.png',
          },
          {
            title: 'Auto-Generate Reports from Live Data',
            points: [

      {

        name: 'Elo Checker',
        tagline: 'Turn match data into clear, explainable ban evidence.',

        color: '#a855f7', shadow: 'rgba(168,85,247,0.3)', bg: 'rgba(168,85,247,0.1)', dim: 'rgba(168,85,247,0.18)',
        painPoints: [

        ],

        ],
        keyFeatures: [],

        ],

      },
    ]

    // ── TOP NAV ──────────────────────────────────────────────────────────
    function NavBar({ current, tools, onNavigate, navigateMain }) {
      return h`
        <nav class="nav">
          <span class="nav-logo" onClick=${() => onNavigate(0)}>AoV TH AI Tools</span>

          <div class="nav-pills">
            <button class=${'nav-pill' + (current === 0 ? ' active' : '')} style=${{ color: current === 0 ? '#fff' : '' }} onClick=${() => onNavigate(0)}>Overview</button>
            ${tools.map((t, i) => {
              const isActive = current === i + 1
              return h`
                <button key=${t.id} class=${'nav-pill' + (isActive ? ' active' : '')}
                  style=${{ color: isActive ? t.color : '', background: isActive ? t.bg : '' }}
                  onClick=${() => onNavigate(i + 1)}>
                  ${t.name}
                </button>
              `
            })}
          </div>

          <div class="nav-right">
            <div class="nav-arrows">
              <button class="nav-arrow" onClick=${() => navigateMain(-1)} disabled=${current === 0}>←</button>
              <button class="nav-arrow" onClick=${() => navigateMain(1)} disabled=${current === 4}>→</button>
            </div>
          </div>
        </nav>
      `
    }

    // ── HOME SLIDE ───────────────────────────────────────────────────────
    function HomeSlide({ tools, onSelectTool }) {
      return h`
        <div class="slide home-slide bg-grid">

          <div class="home-header" style=${{ position: 'relative', zIndex: 1 }}>
            <div class="home-eyebrow">
              <span class="live-dot" />
              All tools are live and ready to use
            </div>
            <h1 class="home-title">AoV TH AI Tools</h1>
            <p class="home-sub">4 tools built to eliminate manual work and help every team move faster</p>
          </div>

          <div class="tool-cards" style=${{ position: 'relative', zIndex: 1 }}>
            ${tools.map((tool, i) => h`
              <div
                key=${tool.id}
                class="tool-card"
                style=${{ borderColor: tool.color + '25' }}
                onClick=${() => onSelectTool(i + 1)}
                onMouseEnter=${e => { e.currentTarget.style.boxShadow = '0 20px 60px ' + tool.shadow; e.currentTarget.style.borderColor = tool.color + '50' }}
                onMouseLeave=${e => { e.currentTarget.style.boxShadow = 'none'; e.currentTarget.style.borderColor = tool.color + '25' }}
              >
                <div class="tool-card-icon" style=${{ background: tool.bg }}>
                  ${ICONS[tool.id](tool.color)}
                </div>
                <div>
                  <div class="tool-card-name">${tool.name}</div>
                  <div class="tool-card-tagline" style=${{ color: tool.color }}>${tool.tagline}</div>
                </div>
                <ul class="tool-card-points">
                  ${tool.cardPoints.map((p, j) => h`<li key=${j}>${p}</li>`)}
                </ul>
                <button
                  class="tool-card-cta"
                  style=${{ background: tool.dim, color: tool.color }}
                >
                  Explore →
                </button>
              </div>
            `)}
          </div>
        </div>
      `
    }

    // ── IMAGE CAROUSEL ───────────────────────────────────────────────────
    function ImageCarousel({ images, title, color }) {
      const [idx, setIdx] = useState(0)
      const [animated, setAnimated] = useState(true)
      const startX = useRef(null)
      // Clone first image at end for seamless infinite loop
      const extended = [...images, images[0]]

      useEffect(() => {
        const t = setInterval(() => setIdx(i => i + 1), 5000)
        return () => clearInterval(t)
      }, [])

      // When we land on the clone, snap back to real index 0 without animation
      useEffect(() => {
        if (idx !== images.length) return
        const timer = setTimeout(() => {
          setAnimated(false)
          setIdx(0)
          requestAnimationFrame(() => requestAnimationFrame(() => setAnimated(true)))
        }, 520) // wait for slide-in to finish
        return () => clearTimeout(timer)
      }, [idx, images.length])

      const go = (i) => { setAnimated(true); setIdx(i) }
      const activeIdx = idx % images.length

      return h`
        <div style=${{ flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column', gap: '6px' }}>
          <div
            style=${{ flex: 1, minHeight: 0, borderRadius: '10px', border: '1px solid rgba(255,255,255,0.08)', overflow: 'hidden', cursor: 'grab', userSelect: 'none' }}
            onMouseDown=${e => { startX.current = e.clientX }}
            onMouseUp=${e => {
              if (startX.current === null) return
              const dx = startX.current - e.clientX
              if (dx > 30) go(Math.min(idx + 1, images.length))
              else if (dx < -30) go(Math.max(idx - 1, 0))
              startX.current = null
            }}
            onMouseLeave=${() => { startX.current = null }}
          >
            <div style=${{ display: 'flex', height: '100%', transform: 'translateX(' + (-idx * 100) + '%)', transition: animated ? 'transform 0.5s cubic-bezier(0.16,1,0.3,1)' : 'none' }}>
              ${extended.map((src, si) => h`
                <div key=${si} style=${{ flexShrink: 0, width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <img src=${src} alt=${title + ' ' + (si+1)} style=${{ maxWidth: '100%', maxHeight: '100%', objectFit: 'contain', display: 'block', pointerEvents: 'none' }} />
                </div>
              `)}
            </div>
          </div>
          <div style=${{ display: 'flex', justifyContent: 'center', gap: '6px', flexShrink: 0 }}>
            ${images.map((_, i) => h`
              <button key=${i} onClick=${() => go(i)} style=${{
                width: i === activeIdx ? '18px' : '6px', height: '6px', borderRadius: '3px', padding: 0,
                background: i === activeIdx ? color : 'rgba(255,255,255,0.2)',
                border: 'none', cursor: 'pointer', transition: 'all 0.25s',
              }} />
            `)}
          </div>
        </div>
      `
    }

    // ── TOOL CONTAINER (overview + key features, shared sticky header) ──
    function ToolContainer({ tool }) {
      const [showFeatures, setShowFeatures] = useState(false)
      const C = { problem: '#ff5c5c', solution: '#34d399', benefits: '#60a5fa' }

      return h`
        <div class="slide tool-slide bg-grid">

          <!-- Ambient glow -->
          <div style=${{ position: 'absolute', top: '-100px', right: '-100px', width: '500px', height: '500px', borderRadius: '50%', background: 'radial-gradient(circle, ' + tool.shadow + ' 0%, transparent 65%)', pointerEvents: 'none', opacity: 0.5 }} />

          <!-- STICKY HEADER — never moves between panels -->
          <div class="tool-slide-head" style=${{ background: 'linear-gradient(135deg, ' + tool.bg + ' 0%, transparent 100%)', borderBottom: '1px solid ' + tool.color + '20' }}>
            <div class="tool-slide-icon" style=${{ background: tool.dim }}>
              ${ICONS[tool.id](tool.color)}
            </div>
            <div>
              <div class="tool-slide-name" style=${{ background: 'linear-gradient(90deg, #fff 0%, ' + tool.color + ' 200%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text' }}>${tool.name}</div>
              <div class="tool-slide-tagline" style=${{ color: tool.color }}>${tool.tagline}</div>
            </div>
            <div style=${{ marginLeft: 'auto', flexShrink: 0 }}>
              <div style=${{ display: 'flex', borderRadius: '10px', background: 'rgba(0,0,0,0.3)', border: '1px solid rgba(255,255,255,0.1)', overflow: 'hidden' }}>
                <button
                  onClick=${() => setShowFeatures(false)}
                  style=${{
                    padding: '8px 20px', border: 'none', borderRight: '1px solid rgba(255,255,255,0.08)',
                    cursor: showFeatures ? 'pointer' : 'default',
                    background: !showFeatures ? tool.color : 'transparent',
                    color: !showFeatures ? '#fff' : 'rgba(255,255,255,0.38)',
                    fontSize: '13px', fontWeight: 700, fontFamily: 'inherit',
                    transition: 'background 0.25s, color 0.25s',
                    textShadow: !showFeatures ? '0 0 12px rgba(255,255,255,0.4)' : 'none',
                  }}
                >Overview</button>
                <button
                  onClick=${() => setShowFeatures(true)}
                  style=${{
                    padding: '8px 20px', border: 'none',
                    cursor: showFeatures ? 'default' : 'pointer',
                    background: showFeatures ? tool.color : 'transparent',
                    color: showFeatures ? '#fff' : 'rgba(255,255,255,0.38)',
                    fontSize: '13px', fontWeight: 700, fontFamily: 'inherit',
                    transition: 'background 0.25s, color 0.25s',
                    textShadow: showFeatures ? '0 0 12px rgba(255,255,255,0.4)' : 'none',
                  }}
                >Key Features</button>
              </div>
            </div>
          </div>

          <!-- SLIDING CONTENT — only this part moves -->
          <div style=${{ flex: 1, minHeight: 0, overflow: 'hidden' }}>
            <div style=${{ display: 'flex', height: '100%', width: '200%', transform: showFeatures ? 'translateX(-50%)' : 'translateX(0)', transition: 'transform 0.55s cubic-bezier(0.16,1,0.3,1)', willChange: 'transform' }}>

              <!-- PANEL 1: OVERVIEW (bento grid) -->
              <div style=${{ width: '50%', height: '100%', display: 'flex', flexDirection: 'column' }}>
                <div class="tool-bento">

                  <!-- PAIN POINTS -->
                  <div class="bento-cell" style=${{ borderColor: C.problem + '33' }}>
                    <div class="bento-cell-num">01</div>
                    <div class="bento-cell-head">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke=${C.problem} stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style=${{ flexShrink: 0 }}>
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                      </svg>
                      <div class="bento-label" style=${{ color: C.problem }}>Pain Points</div>
                    </div>
                    <div class="bento-items">
                      ${tool.painPoints.map((p, i) => h`
                        <div key=${i} class="bento-item">
                          <span class="bento-dot" style=${{ background: C.problem, marginTop: '7px' }} />
                          ${p}
                        </div>
                      `)}
                    </div>
                  </div>

                  <!-- SOLUTION -->
                  <div class="bento-cell" style=${{ borderColor: C.solution + '33' }}>
                    <div class="bento-cell-num">02</div>
                    <div class="bento-cell-head">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke=${C.solution} stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style=${{ flexShrink: 0 }}>
                        <line x1="9" y1="18" x2="15" y2="18"/><line x1="10" y1="22" x2="14" y2="22"/>
                        <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/>
                      </svg>
                      <div class="bento-label" style=${{ color: C.solution }}>Solution</div>
                    </div>
                    <div class="bento-items">
                      ${tool.solutions.map((s, i) => h`
                        <div key=${i} class="bento-item">
                          <span class="bento-dot" style=${{ background: C.solution, marginTop: '7px' }} />
                          ${s}
                        </div>
                      `)}
                    </div>
                  </div>

                  <!-- BENEFIT -->
                  <div class="bento-cell" style=${{ borderColor: C.benefits + '33' }}>
                    <div class="bento-cell-num">03</div>
                    <div class="bento-cell-head">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke=${C.benefits} stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style=${{ flexShrink: 0 }}>
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
                        <polyline points="17 6 23 6 23 12"/>
                      </svg>
                      <div class="bento-label" style=${{ color: C.benefits }}>Benefit</div>
                    </div>
                    <div class="bento-items">
                      ${tool.benefits.map((b, i) => h`
                        <div key=${i} class="bento-item">
                          <span class="bento-dot" style=${{ background: C.benefits, marginTop: '7px' }} />
                          ${b}
                        </div>
                      `)}
                    </div>
                  </div>

                  <!-- GET STARTED -->
                  <div class="bento-cell" style=${{ borderColor: tool.color + '35', background: tool.bg }}>
                    <div class="bento-cell-num">04</div>
                    <div class="bento-cell-head">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke=${tool.color} stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style=${{ flexShrink: 0 }}>
                        <circle cx="12" cy="12" r="10"/>
                        <polygon points="10 8 16 12 10 16 10 8" fill=${tool.color} stroke="none"/>
                      </svg>
                      <div class="bento-label" style=${{ color: tool.color }}>Get Started</div>
                      <div style=${{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: '5px', padding: '3px 10px', borderRadius: '6px', background: 'rgba(52,211,153,0.12)', border: '1px solid rgba(52,211,153,0.25)', fontSize: '11px', fontWeight: 700, color: '#34d399', flexShrink: 0 }}>
                        <span class="live-dot" />Ready to Use
                      </div>
                    </div>
                    <div class="bento-items" style=${{ flex: 'none' }}>
                      ${tool.howToUse.map((step, i) => h`
                        <div key=${i} class="bento-step">
                          <span class="bento-step-num" style=${{ background: tool.dim, color: tool.color }}>${step.n}</span>
                          ${step.text}
                        </div>
                      `)}
                    </div>
                    <a
                      href=${tool.demoUrl} target="_blank" rel="noopener noreferrer"
                      style=${{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', marginTop: '12px', padding: '11px 16px', borderRadius: '11px', background: tool.color, color: '#fff', fontSize: '14px', fontWeight: 700, textDecoration: 'none', letterSpacing: '-0.1px', boxShadow: '0 4px 16px ' + tool.shadow, transition: 'filter 0.2s, transform 0.2s', flexShrink: 0 }}
                      onMouseEnter=${e => { e.currentTarget.style.filter = 'brightness(1.12)'; e.currentTarget.style.transform = 'translateY(-1px)' }}
                      onMouseLeave=${e => { e.currentTarget.style.filter = 'brightness(1)'; e.currentTarget.style.transform = 'translateY(0)' }}
                    >
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                        <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
                      </svg>
                      Open Tool
                    </a>
                  </div>

                </div>
              </div>

              <!-- PANEL 2: KEY FEATURES -->
              <div style=${{ width: '50%', height: '100%', display: 'flex', flexDirection: 'column', padding: '14px 24px 16px', gap: '12px' }}>
                <div style=${{
                  flex: 1, minHeight: 0, display: 'grid', gap: '12px',
                  gridTemplateColumns: (n => Array(n<=2?n:n===4?2:3).fill('1fr').join(' '))(tool.features.length),
                  gridTemplateRows: (n => { const c=n<=2?n:n===4?2:3; return Array(Math.ceil(n/c)).fill('1fr').join(' ') })(tool.features.length),
                }}>
                  ${tool.features.map((feat, i) => h`
                    <div key=${i} style=${{ display: 'flex', flexDirection: 'column', gap: '12px', background: 'rgba(255,255,255,0.025)', border: '1px solid ' + tool.color + '20', borderRadius: '16px', overflow: 'hidden', padding: '18px' }}>
                      <div style=${{ flexShrink: 0, display: 'flex', alignItems: 'flex-start', gap: '10px' }}>
                        <div style=${{ width: '26px', height: '26px', borderRadius: '8px', background: tool.dim, color: tool.color, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '11px', fontWeight: 800, flexShrink: 0, marginTop: '2px' }}>${i + 1}</div>
                        <div style=${{ fontSize: '22px', fontWeight: 800, color: '#fff', letterSpacing: '-0.4px', lineHeight: 1.25 }}>${feat.title}</div>
                      </div>
                      ${feat.images
                        ? h`<${ImageCarousel} images=${feat.images} title=${feat.title} color=${tool.color} />`
                        : h`<div style=${{ flex: 1, minHeight: 0, borderRadius: '10px', border: '1px solid rgba(255,255,255,0.08)', display: 'flex', alignItems: 'center', justifyContent: 'center', overflowY: 'auto' }}><img src=${feat.image} alt=${feat.title} style=${{ maxWidth: '100%', maxHeight: '100%', objectFit: 'contain', display: 'block' }} /></div>`
                      }
                      <div style=${{ flexShrink: 0, display: 'flex', flexDirection: 'column', gap: '6px' }}>
                        ${feat.points.map((p, j) => h`
                          <div key=${j} style=${{ display: 'flex', alignItems: 'flex-start', gap: '8px', fontSize: '14px', color: 'rgba(255,255,255,0.75)', lineHeight: 1.5 }}>
                            <span style=${{ width: '4px', height: '4px', borderRadius: '50%', background: tool.color, flexShrink: 0, marginTop: '7px' }} />
                            ${p}
                          </div>
                        `)}
                      </div>
                    </div>
                  `)}
                </div>
                <a
                  href=${tool.demoUrl} target="_blank" rel="noopener noreferrer"
                  style=${{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '10px', padding: '14px', borderRadius: '14px', background: tool.color, color: '#fff', fontSize: '15px', fontWeight: 700, textDecoration: 'none', letterSpacing: '-0.2px', boxShadow: '0 6px 24px ' + tool.shadow, flexShrink: 0, transition: 'filter 0.2s, transform 0.2s' }}
                  onMouseEnter=${e => { e.currentTarget.style.filter = 'brightness(1.12)'; e.currentTarget.style.transform = 'translateY(-1px)' }}
                  onMouseLeave=${e => { e.currentTarget.style.filter = 'brightness(1)'; e.currentTarget.style.transform = 'translateY(0)' }}
                >Launch Live Demo →</a>
              </div>

            </div>
          </div>

        </div>
      `
    }

    // ── APP ──────────────────────────────────────────────────────────────
    function App() {
      const [current, setCurrent] = useState(0)

      const navigate = useCallback((idx) => {
        if (idx >= 0 && idx <= 4) setCurrent(idx)
      }, [])

      const navigateMain = useCallback((dir) => {
        const next = current + dir
        if (next >= 0 && next <= 4) setCurrent(next)
      }, [current])

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') navigateMain(1)
          if (e.key === 'ArrowLeft')  navigateMain(-1)
        }
        window.addEventListener('keydown', onKey)
        return () => window.removeEventListener('keydown', onKey)
      }, [navigateMain])

      useEffect(() => {
        let startX = null
        const onTouchStart = (e) => { startX = e.touches[0].clientX }
        const onTouchEnd = (e) => {
          if (startX === null) return
          const dx = startX - e.changedTouches[0].clientX
          if (Math.abs(dx) > 60) navigateMain(dx > 0 ? 1 : -1)
          startX = null
        }
        window.addEventListener('touchstart', onTouchStart, { passive: true })
        window.addEventListener('touchend', onTouchEnd, { passive: true })
        return () => { window.removeEventListener('touchstart', onTouchStart); window.removeEventListener('touchend', onTouchEnd) }
      }, [navigateMain])

      const progressPct = (current / 4) * 100
      const activeTool = current >= 1 ? tools[current - 1] : null

      return h`
        <div>
          <${NavBar}
            current=${current} tools=${tools}
            onNavigate=${navigate} navigateMain=${navigateMain}
          />

          <div class="slides-viewport">
            <div class="slides-track" style=${{ transform: 'translateX(' + (-current * 100) + 'vw)' }}>
              <${HomeSlide} tools=${tools} onSelectTool=${navigate} />
              ${tools.map((tool) => h`
                <${ToolContainer} key=${tool.id} tool=${tool} />
              `)}
            </div>
          </div>

          <div class="progress-bar">
            <div class="progress-fill" style=${{ width: progressPct + '%', background: activeTool ? activeTool.color : 'rgba(255,255,255,0.3)' }} />
          </div>

          <div class="slide-hint">Use ← → arrow keys or swipe to navigate</div>
        </div>
      `
    }

    createRoot(document.getElementById('root')).render(h`<${App} />`)
  </script>
</body>
</html>
